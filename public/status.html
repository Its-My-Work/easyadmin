<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Status</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c83ff'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root { --bg: #0f1117; --card: #181b24; --border: #272b38; --text: #e8eaf0; --muted: #8b92a5; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --none: #394055; --info: #58a6ff; color-scheme: dark; }
    :root[data-theme="light"] { --bg: #f5f6fa; --card: #fff; --border: #e1e4ec; --text: #1c2030; --muted: #667089; --none: #d5d9e4; color-scheme: light; }
    @media (prefers-color-scheme: light) { :root:not([data-theme]) { --bg: #f5f6fa; --card: #fff; --border: #e1e4ec; --text: #1c2030; --muted: #667089; --none: #d5d9e4; color-scheme: light; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    header img { height: 36px; max-width: 120px; object-fit: contain; border-radius: 6px; }
    header h1 { margin: 0; font-size: 22px; flex: 1; }
    button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .desc { color: var(--muted); margin: -12px 0 20px; white-space: pre-wrap; }
    .banner { border-radius: 12px; padding: 18px 20px; font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 20px; }
    .banner.operational { background: var(--ok); } .banner.maintenance { background: var(--info); } .banner.partial_outage { background: var(--warn); } .banner.major_outage { background: var(--bad); } .banner.unknown { background: var(--none); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 16px; }
    .svc-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; }
    .svc-name { font-weight: 600; }
    .state { font-size: 13px; font-weight: 600; } .state.operational { color: var(--ok); } .state.degraded { color: var(--warn); } .state.outage { color: var(--bad); } .state.unknown { color: var(--muted); }
    .bars { display: flex; gap: 2px; height: 34px; }
    .bar { flex: 1; min-width: 0; border-radius: 2px; background: var(--none); position: relative; }
    .bar.ok { background: var(--ok); } .bar.warn { background: var(--warn); } .bar.bad { background: var(--bad); }
    .bar:hover { filter: brightness(1.2); outline: 1px solid var(--text); z-index: 2; }
    .bar .tip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 4px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; pointer-events: none; }
    .bar:hover .tip, .bar:focus .tip { display: block; }
    .bar:nth-child(-n+8) .tip { left: 0; transform: none; } .bar:nth-last-child(-n+8) .tip { left: auto; right: 0; transform: none; }
    .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
    .inc h3 { margin: 0 0 4px; font-size: 15px; } .inc .meta { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; } .inc p { margin: 0 0 6px; white-space: pre-wrap; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; color: #fff; margin-right: 6px; }
    .tag.minor { background: var(--warn); } .tag.major { background: var(--bad); } .tag.maintenance { background: var(--info); }
    .muted { color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 28px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/js/status-page.js"></script>
</body>
</html>
